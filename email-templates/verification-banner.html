<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação de Email - Armazix</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        }
        
        .email-container {
            max-width: 1200px;
            margin: 0 auto;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1530 100%);
            position: relative;
            overflow: hidden;
        }
        
        /* Efeito de grid/tech background */
        .background-effect {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0.1;
            background-image: 
                linear-gradient(0deg, transparent 24%, rgba(34, 197, 94, 0.05) 25%, rgba(34, 197, 94, 0.05) 26%, transparent 27%, transparent 74%, rgba(34, 197, 94, 0.05) 75%, rgba(34, 197, 94, 0.05) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(34, 197, 94, 0.05) 25%, rgba(34, 197, 94, 0.05) 26%, transparent 27%, transparent 74%, rgba(34, 197, 94, 0.05) 75%, rgba(34, 197, 94, 0.05) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
            pointer-events: none;
        }
        
        /* Elementos decorativos flutuantes */
        .float-element {
            position: absolute;
            border-radius: 50%;
            opacity: 0.08;
            pointer-events: none;
        }
        
        .float-1 {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #22c55e, #00ff00);
            top: -100px;
            right: -50px;
        }
        
        .float-2 {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #22c55e, transparent);
            bottom: -50px;
            left: 100px;
        }
        
        .content {
            position: relative;
            z-index: 2;
            padding: 60px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
            min-height: 600px;
        }
        
        .left-section {
            flex: 1;
            color: white;
        }
        
        .right-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Logo */
        .logo {
            font-size: 14px;
            font-weight: 600;
            color: #22c55e;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .logo::before {
            content: '🏢';
            font-size: 20px;
        }
        
        /* Heading */
        .main-heading {
            font-size: 48px;
            font-weight: 700;
            line-height: 1.2;
            margin: 0 0 20px 0;
            letter-spacing: -0.5px;
        }
        
        .highlight {
            color: #22c55e;
        }
        
        /* Descrição */
        .description {
            font-size: 16px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.7);
            margin: 20px 0 0 0;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        
        .description::before {
            content: '✉️';
            font-size: 20px;
            flex-shrink: 0;
            margin-top: 2px;
        }
        
        /* Code Box - COMPONENTE REUTILIZÁVEL */
        .code-box {
            background: rgba(10, 14, 39, 0.8);
            border: 2px solid #22c55e;
            border-radius: 12px;
            padding: 32px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 
                0 0 20px rgba(34, 197, 94, 0.3),
                inset 0 0 20px rgba(34, 197, 94, 0.05);
            min-width: 320px;
            position: relative;
        }
        
        .code-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 10px;
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }
        
        .code-label {
            font-size: 12px;
            color: rgba(34, 197, 94, 0.8);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 16px;
            font-weight: 600;
        }
        
        .code-display {
            font-size: 48px;
            font-weight: 700;
            font-family: 'Courier New', 'Monaco', monospace;
            color: #22c55e;
            letter-spacing: 8px;
            word-spacing: 8px;
            margin: 0;
            text-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
            position: relative;
            z-index: 1;
            line-height: 1.4;
        }
        
        .code-hint {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Features */
        .features {
            display: flex;
            gap: 20px;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        
        .feature {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .feature-icon {
            width: 28px;
            height: 28px;
            border: 1px solid #22c55e;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .content {
                flex-direction: column;
                padding: 40px 20px;
                gap: 30px;
            }
            
            .main-heading {
                font-size: 32px;
            }
            
            .code-box {
                min-width: 100%;
                padding: 24px;
            }
            
            .code-display {
                font-size: 36px;
                letter-spacing: 4px;
            }
            
            .right-section {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="email-container" style="width: 1200px; height: 600px; margin: 0 auto;">
        <div class="background-effect"></div>
        <div class="float-element float-1"></div>
        <div class="float-element float-2"></div>
        
        <div class="content">
            <div class="left-section">
                <div class="logo">Armazix</div>
                
                <h1 class="main-heading">
                    Verifique<br>seu <span class="highlight">email</span>
                </h1>
                
                <p class="description">
                    Use o código abaixo para confirmar sua conta no Armazix.
                </p>
                
                <div class="features">
                    <div class="feature">
                        <div class="feature-icon">🛡️</div>
                        <span>Segurança garantida</span>
                    </div>
                    <div class="feature">
                        <div class="feature-icon">🔒</div>
                        <span>Seus dados protegidos</span>
                    </div>
                    <div class="feature">
                        <div class="feature-icon">✓</div>
                        <span>Verificação rápida e segura</span>
                    </div>
                </div>
            </div>
            
            <div class="right-section">
                <div class="code-box">
                    <div class="code-label">Código de Verificação</div>
                    <div class="code-display">{{CODE}}</div>
                    <div class="code-hint">Válido por 30 minutos</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
